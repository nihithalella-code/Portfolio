<html lang="en">

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='16' fill='%2313223B'/><text x='32' y='44' text-anchor='middle' font-family='Georgia,serif' font-size='34' fill='%23FCE8A6'>N</text></svg>">

<style>
  /* ---------- Design tokens ---------- */
  :root {
    --bg: #F6F7FA;
    --surface: #FFFFFF;
    --ink: #13223B;
    --muted: #4F5B72;          /* 6.4:1 on --bg */
    --line: #E1E7F0;
    --line-strong: #8A96AA;    /* input borders, 3:1+ */
    --accent: #07665F;         /* text accent, 6.3:1 on --bg */
    --accent-solid: #0A7F78;   /* decorative accent */
    --accent-soft: #E2F3EF;
    --focus: #2563EB;
    --navy: #13223B;
    --yellow: #FCE8A6;
    --coral: #F8BDB3;
    --teal: #B3EBE2;
    --violet: #D5CCFF;
    --radius: 16px;
    --radius-sm: 10px;
    --shadow-sm: 0 1px 2px rgba(19, 34, 59, .06), 0 1px 1px rgba(19, 34, 59, .04);
    --shadow-md: 0 18px 40px -18px rgba(19, 34, 59, .28);
    --ease: cubic-bezier(.2, .7, .2, 1);
    --wrap: 1120px;
    --pad: clamp(20px, 4vw, 40px);
  }

  /* ---------- Base ---------- */
  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html {
    scroll-behavior: smooth;
    scroll-padding-top: 88px;
    -webkit-text-size-adjust: 100%;
  }
  body {
    margin: 0;
    font-family: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 1.0625rem;
    line-height: 1.6;
    background: var(--bg);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    padding-top: env(safe-area-inset-top, 0px);
  }
  a { color: inherit; }
  h1, h2, h3 { line-height: 1.15; text-wrap: balance; }
  p { margin: 0; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; border-radius: 6px; }
  main:focus { outline: none; }
  .wrap { max-width: var(--wrap); margin: 0 auto; padding-left: var(--pad); padding-right: var(--pad); }
  .serif { font-family: "Newsreader", Georgia, serif; font-weight: 500; }

  .skip-link {
    position: absolute; left: 16px; top: -100px; z-index: 100;
    background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 8px;
    text-decoration: none; font-weight: 600;
  }
  .skip-link:focus { top: 12px; }

  /* ---------- Header and navigation ---------- */
  .site-header {
    position: sticky; top: 0; z-index: 20;
    padding-top: env(safe-area-inset-top, 0px);
    background: rgba(246, 247, 250, .92);
    -webkit-backdrop-filter: saturate(1.4) blur(10px);
    backdrop-filter: saturate(1.4) blur(10px);
    border-bottom: 1px solid transparent;
    transition: border-color 200ms var(--ease);
  }
  .site-header.is-scrolled { border-bottom-color: var(--line); }
  .header-inner { display: flex; align-items: center; justify-content: space-between; height: 68px; gap: 16px; position: relative; }
  .brand {
    font-family: "Newsreader", Georgia, serif; font-size: 1.3rem; font-weight: 500;
    text-decoration: none; color: var(--ink); letter-spacing: -.01em;
    padding: 6px 0;
  }
  .site-nav { display: flex; align-items: center; gap: 2px; }
  .nav-link {
    position: relative; color: var(--muted); text-decoration: none; font-size: .95rem; font-weight: 500;
    padding: 8px 12px; border-radius: 8px;
    transition: color 160ms var(--ease), background-color 160ms var(--ease);
  }
  .nav-link:hover { color: var(--ink); background: rgba(19, 34, 59, .05); }
  .nav-link[aria-current="page"] { color: var(--accent); }
  .nav-link[aria-current="page"]::after {
    content: ""; position: absolute; left: 12px; right: 12px; bottom: 2px; height: 2px;
    border-radius: 2px; background: var(--accent-solid);
  }
  .nav-cta {
    margin-left: 10px; background: var(--ink); color: #fff; padding: 9px 16px;
    transition: background-color 160ms var(--ease), transform 160ms var(--ease);
  }
  .nav-cta:hover { background: #1F3457; color: #fff; transform: translateY(-1px); }
  .nav-cta[aria-current="page"]::after { display: none; }

  .menu-toggle {
    display: none; position: relative; width: 44px; height: 44px; padding: 0;
    border: 0; border-radius: 10px; background: transparent; cursor: pointer;
  }
  .menu-toggle::before, .menu-toggle::after, .menu-toggle span {
    content: ""; position: absolute; left: 12px; right: 12px; height: 2px; border-radius: 2px;
    background: var(--ink); transition: transform 220ms var(--ease), opacity 220ms var(--ease);
  }
  .menu-toggle::before { top: 15px; }
  .menu-toggle span { top: 21px; }
  .menu-toggle::after { top: 27px; }
  .menu-open .menu-toggle::before { transform: translateY(6px) rotate(45deg); }
  .menu-open .menu-toggle span { opacity: 0; }
  .menu-open .menu-toggle::after { transform: translateY(-6px) rotate(-45deg); }

  @media (max-width: 860px) {
    .menu-toggle { display: block; }
    .site-nav {
      position: absolute; top: 100%; left: 0; right: 0;
      display: none; flex-direction: column; align-items: stretch; gap: 4px;
      padding: 8px var(--pad) 20px;
      background: var(--bg); border-bottom: 1px solid var(--line); box-shadow: var(--shadow-md);
    }
    .menu-open .site-nav { display: flex; }
    .nav-link { font-size: 1.02rem; min-height: 48px; display: flex; align-items: center; padding: 12px 14px; }
    .nav-link[aria-current="page"]::after { left: 14px; right: auto; width: 24px; bottom: 12px; }
    .nav-cta { margin: 10px 0 0; justify-content: center; }
  }

  /* ---------- Shared components ---------- */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    min-height: 48px; padding: 12px 22px; border-radius: 999px; border: 1px solid transparent;
    font: inherit; font-weight: 600; font-size: 1rem; text-decoration: none; cursor: pointer;
    transition: transform 180ms var(--ease), background-color 180ms var(--ease), box-shadow 180ms var(--ease), border-color 180ms var(--ease), color 180ms var(--ease);
  }
  .btn:hover { transform: translateY(-2px); }
  .btn:active { transform: translateY(0) scale(.98); }
  .btn .arrow { width: 16px; height: 16px; flex-shrink: 0; transition: transform 180ms var(--ease); }
  .btn:hover .arrow { transform: translateX(3px); }
  .btn-primary { background: var(--yellow); color: var(--ink); }
  .btn-primary:hover { background: #F9DE84; box-shadow: 0 10px 24px -10px rgba(252, 232, 166, .6); }
  .btn-ghost { color: #fff; border-color: rgba(255, 255, 255, .35); }
  .btn-ghost:hover { background: rgba(255, 255, 255, .08); border-color: rgba(255, 255, 255, .7); }
  .btn-ink { background: var(--ink); color: #fff; }
  .btn-ink:hover { background: #1F3457; box-shadow: var(--shadow-md); }

  .arrow { width: 16px; height: 16px; flex-shrink: 0; }

  .section { margin-top: 88px; }
  .section-head { margin-bottom: 28px; }
  .section-head h2 { font-family: "Newsreader", Georgia, serif; font-weight: 500; font-size: clamp(1.8rem, 3.2vw, 2.4rem); letter-spacing: -.01em; margin: 0; }
  .section-head p { color: var(--muted); margin-top: 10px; max-width: 58ch; }
  .eyebrow { color: var(--accent); font-size: .85rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }

  .chip {
    display: inline-flex; align-items: center; padding: 6px 13px; border-radius: 999px;
    background: var(--accent-soft); color: var(--accent); font-size: .92rem; font-weight: 500;
  }

  /* ---------- Home: hero ---------- */
  .hero {
    position: relative; isolation: isolate; overflow: hidden;
    display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center;
    gap: clamp(32px, 5vw, 64px);
    margin-top: 24px; padding: clamp(32px, 6vw, 72px);
    background: var(--navy); color: #fff; border-radius: 28px;
  }
  .hero::before {
    content: ""; position: absolute; inset: 0; z-index: -1;
    background: radial-gradient(circle at 88% 8%, rgba(179, 235, 226, .16), transparent 42%);
  }
  .hero::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 6px;
    background: linear-gradient(90deg, var(--coral) 0 25%, var(--yellow) 25% 50%, var(--teal) 50% 75%, var(--violet) 75%);
  }
  .hero :focus-visible { outline-color: var(--yellow); }
  .hero .eyebrow { color: var(--yellow); }
  .hero h1 {
    font-family: "Newsreader", Georgia, serif; font-weight: 500;
    font-size: clamp(2.2rem, 4.8vw, 3.5rem); line-height: 1.08; letter-spacing: -.02em;
    margin: 14px 0 20px; max-width: 18ch;
  }
  .lede { font-size: clamp(1.02rem, 1.4vw, 1.14rem); color: #C9D6E8; max-width: 50ch; margin: 0 0 32px; }
  .cta-row { display: flex; flex-wrap: wrap; gap: 12px; }
  .facts {
    list-style: none; margin: 36px 0 0; padding: 0;
    display: flex; flex-wrap: wrap; gap: 10px 22px; color: #C9D6E8; font-size: .95rem;
  }
  .facts li { display: flex; align-items: center; gap: 8px; }
  .facts li::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--teal); }
  .avatar-wrap { width: clamp(180px, 22vw, 232px); justify-self: end; }
  .avatar {
    display: block; width: 100%; aspect-ratio: 4 / 5; height: auto;
    object-fit: cover; object-position: center top;
    border-radius: 18px;
    box-shadow: 0 0 0 4px var(--teal), 0 24px 48px rgba(0, 0, 0, .35);
  }

  /* ---------- Home: role cards ---------- */
  .role-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 16px; }
  .role-card {
    --c: var(--coral);
    display: flex; flex-direction: column; gap: 12px; min-height: 230px;
    padding: 28px; border-radius: var(--radius);
    background: var(--c); color: var(--ink); text-decoration: none;
    box-shadow: var(--shadow-sm);
    transition: transform 240ms var(--ease), box-shadow 240ms var(--ease);
  }
  .role-card:nth-child(2) { --c: var(--teal); }
  .role-card:nth-child(3) { --c: var(--violet); }
  .role-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-md); }
  .role-card h3 { font-family: "Newsreader", Georgia, serif; font-weight: 500; font-size: 1.55rem; margin: 0; }
  .role-card p { font-size: .98rem; color: rgba(19, 34, 59, .86); }
  .role-card .more {
    margin-top: auto; padding-top: 8px;
    display: inline-flex; align-items: center; gap: 8px; font-weight: 600; font-size: .95rem;
  }
  .role-card .more .arrow { transition: transform 200ms var(--ease); }
  .role-card:hover .more .arrow { transform: translateX(4px); }

  /* ---------- Home: selected work ---------- */
  .projects { display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 20px; }
  .project {
    position: relative; display: flex; flex-direction: column; gap: 12px;
    padding: 30px 28px 26px; background: var(--surface);
    border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow-sm);
    transition: transform 240ms var(--ease), box-shadow 240ms var(--ease), border-color 240ms var(--ease);
  }
  .project::before {
    content: ""; position: absolute; left: 28px; top: 0; width: 44px; height: 4px;
    border-radius: 0 0 4px 4px; background: var(--accent-solid);
  }
  .project:nth-child(2)::before { background: var(--coral); }
  .project:nth-child(3)::before { background: var(--violet); }
  .project:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); border-color: rgba(7, 102, 95, .3); }
  .project .tag { font-size: .8rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
  .project h3 { font-family: "Newsreader", Georgia, serif; font-weight: 500; font-size: 1.5rem; margin: 0; }
  .project-body { color: var(--muted); font-size: .98rem; }
  .project-link {
    align-self: flex-start; display: inline-flex; align-items: center; gap: 6px;
    font-weight: 600; color: var(--accent); text-decoration: none; min-height: 44px; padding: 8px 0;
  }
  .project-link:hover { text-decoration: underline; text-underline-offset: 4px; }
  .outcome { margin-top: auto; padding-top: 18px; border-top: 1px solid var(--line); }
  .outcome span { display: block; font-size: .78rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .outcome strong { font-family: "Newsreader", Georgia, serif; font-weight: 500; font-size: 1.6rem; color: var(--accent); line-height: 1.25; }

  /* ---------- Home: contact ---------- */
  .contact {
    display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: clamp(32px, 5vw, 56px);
    padding: clamp(28px, 4.5vw, 52px); background: var(--surface);
    border: 1px solid var(--line); border-radius: 24px; box-shadow: var(--shadow-sm);
  }
  .contact h2 { font-family: "Newsreader", Georgia, serif; font-weight: 500; font-size: clamp(1.9rem, 3.4vw, 2.5rem); margin: 0 0 14px; letter-spacing: -.01em; }
  .contact-intro { color: var(--muted); max-width: 40ch; }
  .contact-details { list-style: none; margin: 28px 0 0; padding: 0; display: grid; gap: 14px; }
  .contact-details a, .contact-details span { color: var(--ink); text-decoration: none; font-weight: 500; }
  .contact-details a:hover { color: var(--accent); text-decoration: underline; text-underline-offset: 4px; }
  .contact-details .label { display: block; font-size: .78rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .copy-btn {
    margin-top: 14px; min-height: 40px; padding: 8px 14px; font: inherit; font-size: .9rem; font-weight: 600;
    color: var(--accent); background: var(--accent-soft); border: 0; border-radius: 999px; cursor: pointer;
    transition: background-color 160ms var(--ease);
  }
  .copy-btn:hover { background: #CDEDE5; }

  .contact-form { display: grid; gap: 18px; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  .field { display: grid; gap: 6px; }
  .field label { font-weight: 600; font-size: .92rem; }
  .field input, .field textarea {
    width: 100%; font: inherit; font-size: 1rem; color: var(--ink);
    background: var(--bg); border: 1px solid var(--line-strong); border-radius: 10px;
    padding: 12px 14px; min-height: 48px;
    transition: border-color 160ms var(--ease), background-color 160ms var(--ease), box-shadow 160ms var(--ease);
  }
  .field textarea { min-height: 140px; resize: vertical; }
  .field input:hover, .field textarea:hover { border-color: var(--ink); }
  .field input:focus, .field textarea:focus { outline: none; background: #fff; border-color: var(--focus); box-shadow: 0 0 0 3px rgba(37, 99, 235, .2); }
  .form-note { font-size: .9rem; color: var(--muted); }
  .form-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 16px; justify-content: space-between; }
  .form-status { font-size: .92rem; color: var(--accent); min-height: 1.4em; }

  /* ---------- Shared page structure ---------- */
  .back {
    display: inline-flex; align-items: center; gap: 8px; margin-top: 32px; min-height: 44px;
    color: var(--muted); text-decoration: none; font-size: .95rem; font-weight: 500;
  }
  .back:hover { color: var(--ink); }
  .back .arrow { transform: rotate(180deg); }
  .page-head { padding: 28px 0 0; }
  .page-head h1 {
    font-family: "Newsreader", Georgia, serif; font-weight: 500;
    font-size: clamp(2.3rem, 5vw, 3.4rem); letter-spacing: -.02em; margin: 14px 0 0;
  }
  .lead { font-size: clamp(1.02rem, 1.4vw, 1.13rem); color: var(--muted); max-width: 64ch; margin: 22px 0 0; }
  .highlights { display: flex; flex-wrap: wrap; gap: 8px; margin: 26px 0 0; padding: 0; list-style: none; }

  .checklist {
    margin-top: 40px; padding: 24px 26px; background: var(--surface);
    border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow-sm);
  }
  .checklist h2 { font-size: 1rem; font-weight: 600; margin: 0 0 16px; }
  .checklist ol {
    list-style: none; counter-reset: item; margin: 0; padding: 0;
    display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px;
  }
  .checklist li {
    counter-increment: item; display: flex; align-items: center; gap: 12px;
    padding: 12px 14px; background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius-sm); font-weight: 500;
  }
  .checklist li::before {
    content: counter(item, decimal-leading-zero); font-family: "Newsreader", Georgia, serif;
    font-size: 1.05rem; color: var(--accent);
  }

  .case-list { display: grid; gap: 12px; }
  details.case {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-sm);
    box-shadow: var(--shadow-sm); transition: border-color 200ms var(--ease);
  }
  details.case[open] { border-color: rgba(7, 102, 95, .45); }
  details.case summary {
    list-style: none; cursor: pointer; display: flex; align-items: center; gap: 16px;
    padding: 18px 22px; min-height: 60px; font-weight: 600;
  }
  details.case summary::-webkit-details-marker { display: none; }
  .case-no { font-family: "Newsreader", Georgia, serif; font-size: 1.1rem; color: var(--accent); font-weight: 500; }
  .case-title { flex: 1; }
  details.case summary::after {
    content: ""; width: 9px; height: 9px; flex-shrink: 0;
    border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted);
    transform: rotate(45deg); transition: transform 200ms var(--ease);
  }
  details.case[open] summary::after { transform: rotate(-135deg); }
  details.case p { margin: 0; padding: 0 22px 20px 60px; color: var(--muted); }

  .next { margin-top: 88px; padding-top: 28px; border-top: 1px solid var(--line); }
  .next h2 { font-size: .95rem; color: var(--muted); font-weight: 600; letter-spacing: .04em; text-transform: uppercase; margin: 0 0 16px; }
  .next-links { display: flex; flex-wrap: wrap; gap: 10px; }
  .next-links a {
    display: inline-flex; align-items: center; gap: 8px; min-height: 44px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 999px;
    padding: 10px 18px; text-decoration: none; font-weight: 500;
    transition: border-color 160ms var(--ease), transform 160ms var(--ease), box-shadow 160ms var(--ease);
  }
  .next-links a:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: var(--shadow-sm); }

  .cta-strip {
    margin-top: 40px; padding: 24px 28px; border-radius: var(--radius);
    background: var(--navy); color: #fff;
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px;
  }
  .cta-strip p { font-family: "Newsreader", Georgia, serif; font-size: 1.35rem; font-weight: 500; }
  .cta-strip :focus-visible { outline-color: var(--yellow); }

  /* ---------- Background page ---------- */
  .timeline { list-style: none; margin: 0; padding: 0 0 0 30px; position: relative; }
  .timeline::before {
    content: ""; position: absolute; left: 6px; top: 10px; bottom: 10px; width: 2px;
    background: linear-gradient(var(--accent-solid), var(--line));
    border-radius: 2px;
  }
  .timeline li { position: relative; padding-bottom: 22px; }
  .timeline li:last-child { padding-bottom: 0; }
  .timeline li::before {
    content: ""; position: absolute; left: -30px; top: 26px; width: 14px; height: 14px; border-radius: 50%;
    background: var(--surface); border: 3px solid var(--accent-solid);
  }
  .job {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 24px 26px; box-shadow: var(--shadow-sm);
  }
  .when {
    display: inline-block; margin-bottom: 12px; padding: 4px 11px; border-radius: 999px;
    background: var(--accent-soft); color: var(--accent); font-size: .85rem; font-weight: 600;
  }
  .job h3 { font-family: "Newsreader", Georgia, serif; font-weight: 500; font-size: 1.4rem; margin: 0 0 12px; }
  .job ul { margin: 0; padding-left: 20px; color: var(--muted); }
  .job li { margin-bottom: 6px; }
  .job li:last-child { margin-bottom: 0; }

  .panels { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
  .panel {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 24px 26px; box-shadow: var(--shadow-sm);
  }
  .panel h3 { font-family: "Newsreader", Georgia, serif; font-weight: 500; font-size: 1.25rem; margin: 0 0 10px; }
  .panel p, .panel li { color: var(--muted); font-size: .98rem; }
  .panel ul { margin: 0; padding-left: 20px; }
  .panel li { margin-bottom: 6px; }
  .accent-top { border-top: 3px solid var(--accent-solid); }

  .skill-groups { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 16px; }
  .skill-group {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 22px 24px; box-shadow: var(--shadow-sm);
  }
  .skill-group h3 { font-size: .8rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 0; }
  .chips { list-style: none; margin: 14px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; }
  .chips .chip { background: var(--bg); color: var(--ink); border: 1px solid var(--line); font-size: .9rem; }

  /* ---------- Footer ---------- */
  .site-footer { margin-top: 112px; border-top: 1px solid var(--line); background: var(--bg); }
  .footer-inner {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 24px;
    padding-top: 28px; padding-bottom: calc(32px + env(safe-area-inset-bottom, 0px)); color: var(--muted); font-size: .95rem;
  }
  .footer-links { display: flex; flex-wrap: wrap; gap: 4px 20px; }
  .footer-links a { color: var(--ink); text-decoration: none; font-weight: 500; min-height: 44px; display: inline-flex; align-items: center; }
  .footer-links a:hover { color: var(--accent); text-decoration: underline; text-underline-offset: 4px; }

  /* ---------- Responsive ---------- */
  @media (max-width: 860px) {
    .hero { grid-template-columns: 1fr; }
    .avatar-wrap { justify-self: start; width: 150px; }
    .contact { grid-template-columns: 1fr; }
  }
  @media (max-width: 560px) {
    .form-row { grid-template-columns: 1fr; }
    .section { margin-top: 64px; }
    .hero { border-radius: 22px; }
    .hero::after { height: 5px; }
    .btn { width: 100%; }
    .cta-row .btn, .form-actions .btn { width: auto; }
    .cta-row { width: 100%; }
    .cta-row .btn { flex: 1 1 100%; }
    .checklist ol { grid-template-columns: 1fr; }
    details.case p { padding-left: 22px; }
    .case-no { display: none; }
    .timeline { padding-left: 26px; }
    .timeline li::before { left: -26px; }
    .timeline::before { left: 6px; }
  }

  /* ---------- Motion (only when the visitor hasn't asked for reduced motion) ---------- */
  @keyframes rise {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: none; }
  }
  .motion .hero-copy { animation: rise 700ms var(--ease) both; }
  .motion .avatar-wrap { animation: rise 800ms 120ms var(--ease) both; }
  .motion .view > .page-head { animation: rise 520ms var(--ease) both; }
  .motion [data-reveal]:not(.is-in) { opacity: 0; transform: translateY(16px); }
  .motion [data-reveal] { transition: opacity 620ms var(--ease), transform 620ms var(--ease); }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>

  // ---------- Helpers ----------
  function el(tag, props, children) {
    const node = document.createElement(tag);
    if (props) {
      for (const [k, v] of Object.entries(props)) {
        if (k === "text") node.textContent = v;
        else node.setAttribute(k, v);
      }
    }
    (children || []).forEach(c => {
      if (c === null || c === undefined) return;
      node.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
    });
    return node;
  }

  function arrow() {
    const t = document.createElement("template");
    t.innerHTML = '<svg class="arrow" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M3 8h9.5M8.5 4.5 12 8l-3.5 3.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    return t.content.firstElementChild;
  }

  function sectionHead(title, sub) {
    return el("div", { class: "section-head", "data-reveal": "" }, [
      el("h2", { text: title }),
      sub ? el("p", { text: sub }) : null
    ]);
  }

  function setCurrent(id, title, description) {
    currentRoute = id;
    renderNav(id);
    document.title = title;
    document.querySelector('meta[name="description"]').setAttribute("content", description);
    document.querySelector('meta[property="og:title"]').setAttribute("content", title);
    document.querySelector('meta[property="og:description"]').setAttribute("content", description);
  }

  function renderNav(active) {
    const items = [{ id: "home", label: "Home", href: "#/" }]
      .concat(roles.map(r => ({ id: r.id, label: r.short, href: "#/" + r.id })))
      .concat([{ id: "background", label: "Background", href: "#/background" }]);
    const links = items.map(i => el("a", Object.assign({ class: "nav-link", href: i.href, text: i.label },
      i.id === active ? { "aria-current": "page" } : {})));
    links.push(el("a", { class: "nav-link nav-cta", href: "#contact", text: "Contact" }));
    nav.replaceChildren(...links);
  }

  // ---------- Mobile menu ----------
  function setMenu(open) {
    header.classList.toggle("menu-open", open);
    menuToggle.setAttribute("aria-expanded", String(open));
    menuToggle.setAttribute("aria-label", open ? "Close menu" : "Open menu");
  }
  menuToggle.addEventListener("click", () => setMenu(!header.classList.contains("menu-open")));
  nav.addEventListener("click", e => { if (e.target.closest("a")) setMenu(false); });
  document.addEventListener("keydown", e => {
    if (e.key === "Escape" && header.classList.contains("menu-open")) {
      setMenu(false);
      menuToggle.focus();
    }

  matchMedia("(min-width: 861px)").addEventListener("change", e => { if (e.matches) setMenu(false); });

      e.preventDefault();
      if (!form.reportValidity()) return;
      const data = new FormData(form);
      const name = String(data.get("name")).trim();
      const subject = "Portfolio enquiry from " + name;
      const body = String(data.get("message")).trim() + "\n\n— " + name + " (" + String(data.get("email")).trim() + ")";
      window.location.href = "mailto:" + EMAIL + "?subject=" + encodeURIComponent(subject) + "&body=" + encodeURIComponent(body);
      status.textContent = "Opening your email app. If nothing happens, email " + EMAIL + " directly.";
    });

    return el("section", { class: "contact", id: "contact", "aria-labelledby": "contact-title", "data-reveal": "" }, [
      el("div", null, [
        el("p", { class: "eyebrow", text: "Contact" }),
        el("h2", { id: "contact-title", text: "Let's connect" }),
        el("p", { class: "contact-intro", text: "I'm open to product roles and conversations about enterprise platforms, UX strategy, and data products. Send a note and I'll get back to you by email." }),
        el("ul", { class: "contact-details" }, [
          el("li", null, [
            el("span", { class: "label", text: "Email" }),
            el("a", { href: "mailto:" + EMAIL, text: EMAIL }),
            copyBtn
          ]),
          el("li", null, [
            el("span", { class: "label", text: "Location" }),
            el("span", { text: "Bengaluru, India" })
          ])
        ])
      ]),
      form
    ]);
  }

  function nextSection(exclude) {
    const links = roles.filter(r => r.id !== exclude).map(r => el("a", { href: "#/" + r.id }, [r.title, arrow()]));
    if (exclude !== "background") links.push(el("a", { href: "#/background" }, ["Background", arrow()]));
    return el("section", { class: "next" }, [
      el("h2", { text: "Explore more" }),
      el("div", { class: "next-links" }, links)
    ]);
  }

  // ---------- Pages ----------
  function renderHome() {
    setCurrent("home", "Nihitha Lella · Technical Product Manager", DEFAULT_DESC);
    view.replaceChildren(
      el("section", { class: "hero", "aria-labelledby": "hero-title" }, [
        el("div", { class: "hero-copy" }, [
          el("p", { class: "eyebrow", text: "Technical Product Manager · UX Strategy · Data Products" }),
          el("h1", { id: "hero-title", text: "I turn user pain points into products that ship, with data behind every decision." }),
          el("p", { class: "lede", text: "Execution-focused, working across engineering, UX, and business to deliver scalable enterprise platforms." }),
          el("div", { class: "cta-row" }, [
            el("a", { class: "btn btn-primary", href: "#work" }, ["See selected work", arrow()]),
            el("a", { class: "btn btn-ghost", href: "#contact", text: "Get in touch" })
          ]),
          el("ul", { class: "facts", "aria-label": "Quick facts" }, [
            el("li", { text: "Mercedes-Benz R&D India" }),
            el("li", { text: "Bengaluru, India" }),
            el("li", { text: "Open to product roles" })
          ])
        ]),
        el("div", { class: "avatar-wrap" }, [
          el("img", { class: "avatar", src: AVATAR, alt: "Portrait of Nihitha Lella", width: "320", height: "320", fetchpriority: "high" })
        ])
      ]),

      el("section", { class: "section", "aria-labelledby": "what-title" }, [
        el("div", { class: "section-head", "data-reveal": "" }, [
          el("h2", { id: "what-title", text: "What I do" })
        ]),
        el("div", { class: "role-grid", "data-reveal": "" }, roles.map(r =>
          el("a", { class: "role-card", href: "#/" + r.id }, [
            el("h3", { text: r.title }),
            el("p", { text: r.summary }),
            el("span", { class: "more" }, ["See this role", arrow()])
          ])
        ))
      ]),

      el("section", { class: "section", id: "work", "aria-labelledby": "work-title" }, [
        el("div", { class: "section-head", "data-reveal": "" }, [
          el("h2", { id: "work-title", text: "Selected work" }),
          el("p", { text: "Enterprise platform and product work, with the outcome measured for each." })
        ]),
        el("div", { class: "projects", "data-reveal": "" }, projects.map(projectCard))
      ]),

      el("section", { class: "section" }, [contactSection()])
    );
    observeReveals();
  }

  function renderRole(role) {
    setCurrent(role.id, role.title + " · Nihitha Lella", role.summary + " Nihitha Lella, Technical Product Manager.");
    const children = [
      el("a", { class: "back", href: "#/" }, [arrow(), "Back to home"]),
      el("header", { class: "page-head" }, [
        el("p", { class: "eyebrow", text: "Focus area" }),
        el("h1", { text: role.title }),
        el("p", { class: "lead", text: role.lead }),
        el("ul", { class: "highlights" }, role.highlights.map(h => el("li", { class: "chip", text: h })))
      ])
    ];

    if (role.checklist) {
      children.push(el("section", { class: "checklist", "data-reveal": "" }, [
        el("h2", { text: "The six checklist areas every project runs against" }),
        el("ol", { role: "list" }, role.checklist.map(c => el("li", { text: c })))
      ]));
    }

    children.push(
      el("section", { class: "section", "aria-labelledby": "cases-title" }, [
        el("h2", { id: "cases-title", class: "section-head", text: "Case studies" }),
        el("div", { class: "case-list", "data-reveal": "" }, role.cases.map((c, i) =>
          el("details", { class: "case" }, [
            el("summary", null, [
              el("span", { class: "case-no", text: String(i + 1).padStart(2, "0") }),
              el("span", { class: "case-title", text: c.title })
            ]),
            el("p", { text: c.summary })
          ])
        ))
      ]),
      el("div", { class: "cta-strip" }, [
        el("p", { text: "Want to talk about this work?" }),
        el("a", { class: "btn btn-primary", href: "#contact" }, ["Get in touch", arrow()])
      ]),
      nextSection(role.id)
    );
    view.replaceChildren(...children);
    observeReveals();
  }

  function renderBackground() {
    setCurrent("background", "Background · Nihitha Lella", "Experience, recognition, skills, and education of Nihitha Lella, Technical Product Manager at Mercedes-Benz R&D India.");
    view.replaceChildren(
      el("header", { class: "page-head" }, [
        el("p", { class: "eyebrow", text: "Background" }),
        el("h1", { text: "Background" }),
        el("p", { class: "lead", text: "Experience at Mercedes-Benz Research & Development India, where I moved from engineering trainee to product manager." })
      ]),

      el("section", { class: "section", "aria-labelledby": "exp-title" }, [
        el("div", { class: "section-head", "data-reveal": "" }, [el("h2", { id: "exp-title", text: "Experience" })]),
        el("ol", { class: "timeline", "data-reveal": "" }, experience.map(job =>
          el("li", null, [
            el("article", { class: "job" }, [
              el("p", { class: "when", text: job.when }),
              el("h3", { text: job.title }),
              el("ul", null, job.points.map(p => el("li", { text: p })))
            ])
          ])
        ))
      ]),

      el("section", { class: "section", "aria-labelledby": "awards-title" }, [
        el("div", { class: "section-head", "data-reveal": "" }, [el("h2", { id: "awards-title", text: "Awards" })]),
        el("div", { class: "panels", "data-reveal": "" }, [
          el("section", { class: "panel accent-top" }, [
            el("h3", { text: "Spontan, 2025" }),
            el("p", { text: "Recognized for stakeholder communication, delivery expectations, and cross-functional coordination across enterprise applications." })
          ]),
          el("section", { class: "panel accent-top" }, [
            el("h3", { text: "Bronze, 2024" }),
            el("p", { text: "Recognized for moving from Scrum coordination into product ownership within the first year, and for a 30% reduction in rework." })
          ])
        ])
      ]),

      el("section", { class: "section", "aria-labelledby": "skills-title" }, [
        el("div", { class: "section-head", "data-reveal": "" }, [el("h2", { id: "skills-title", text: "Skills" })]),
        el("div", { class: "skill-groups", "data-reveal": "" }, skillGroups.map(g =>
          el("section", { class: "skill-group" }, [
            el("h3", { text: g.label }),
            el("ul", { class: "chips" }, g.items.map(i => el("li", null, [el("span", { class: "chip", text: i })])))
          ])
        ))
      ]),

      el("section", { class: "section", "aria-labelledby": "edu-title" }, [
        el("div", { class: "section-head", "data-reveal": "" }, [el("h2", { id: "edu-title", text: "Education" })]),
        el("div", { class: "panel", "data-reveal": "" }, [
          el("ul", null, [
            el("li", { text: "B.Tech, Information Science Engineering, MVJ College of Engineering (CGPA 9.47)" }),
            el("li", { text: "Senior Secondary, Narayana College (CBSE), 78.4%" }),
            el("li", { text: "Higher Secondary, Geethanjali Vidyalaya" })
          ])
        ])
      ]),

      nextSection("background")
    );
    observeReveals();
  }

  // ---------- Motion: reveal on scroll (skipped entirely for reduced motion) ----------
  function observeReveals() {
    if (!motion) return;
    const items = document.querySelectorAll("[data-reveal]:not(.is-in)");
    if (!items.length) return;
    if (!("IntersectionObserver" in window)) { items.forEach(i => i.classList.add("is-in")); return; }
    const io = new IntersectionObserver(entries => {
      entries.forEach(en => {
        if (en.isIntersecting) {
          en.target.classList.add("is-in");
          io.unobserve(en.target);
        }
      });
    }, { rootMargin: "0px 0px -8% 0px", threshold: 0.12 });
    items.forEach(i => io.observe(i));
  }

  // ---------- Routing ----------
  // "#/route" renders a page. "#section-id" scrolls to a section, rendering home first if needed.
  function scrollToSection(id) {
    if (id === "top") { window.scrollTo({ top: 0, behavior: motion ? "smooth" : "auto" }); return; }
    if (currentRoute !== "home") renderHome();
    const target = document.getElementById(id);
    if (target) {
      requestAnimationFrame(() => target.scrollIntoView({ behavior: motion ? "smooth" : "auto", block: "start" }));
    }
  }

  function route() {
    const hash = location.hash;
    if (hash.length > 1 && !hash.startsWith("#/")) {
      scrollToSection(decodeURIComponent(hash.slice(1)));
      return;
    }
    const id = hash.replace(/^#\/?/, "");
    if (id === "background") renderBackground();
    else {
      const role = roles.find(r => r.id === id);
      if (role) renderRole(role);
      else renderHome();
    }
    window.scrollTo(0, 0);
    // Move focus to the new page on in-app navigation, not on first load.
    if (routedOnce) view.focus({ preventScroll: true });
    routedOnce = true;
  }

  window.addEventListener("hashchange", route);
  route();
</script>
